<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/16__1_-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assist Plus Care — Healthcare & Care Recruitment Consultancy</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div id="root">
      <!-- Instant HTML Preloader Fallback -->
      <div class="preloader-overlay">
        <div class="preloader-bg-glow preloader-glow-1"></div>
        <div class="preloader-bg-glow preloader-glow-2"></div>
        <div class="preloader-content">
          <div class="preloader-logo-wrapper">
            <div class="preloader-pulse-wave wave-1"></div>
            <div class="preloader-pulse-wave wave-2"></div>
            <div class="preloader-logo-card">
              <img src="/16__1_-removebg-preview.png" alt="Assist Plus Care Logo" class="preloader-logo-img" />
            </div>
          </div>
          <div class="preloader-brand-title"><span>ASSIST PLUS</span> <span class="highlight">CARE</span></div>
          <div class="preloader-brand-subtitle">Healthcare & Staffing Excellence</div>
          <div class="preloader-progress-section">
            <div class="preloader-bar-container">
              <div class="preloader-bar-fill" style="width: 25%;">
                <div class="preloader-bar-glow"></div>
              </div>
            </div>
            <div class="preloader-status-meta">
              <span class="preloader-status-text">
                <span class="status-dot"></span>
                Initializing Assist Plus Portal...
              </span>
              <span class="preloader-percentage">Loading...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
